name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check version numbers are in sync
        run: node scripts/sync-version.mjs --check
      - run: npm run typecheck
      - run: npm run build
      - name: Ensure dist is up to date
        run: git diff --exit-code -- dist
      - name: Install browser for bundle tests
        run: npx playwright install --with-deps chromium
      - name: Test the production bundle in Chromium
        run: npm test

  hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: hacs/action@main
        with:
          category: plugin
